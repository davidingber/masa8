<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#45614F">
  <title>מסע 8 הזהויות</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>
  <nav id="nav" class="bottom-nav"></nav>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      // כשגרסה חדשה של ה-Service Worker משתלטת — רענון אוטומטי פעם אחת,
      // כדי שהעדכון יופיע מיד בלי צורך לרענן פעמיים. (רק כשכבר יש גרסה פעילה —
      // לא בהתקנה הראשונה.)
      let swReloading = false;
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (swReloading) return;
          swReloading = true;
          location.reload();
        });
      }
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(reg => {
          reg.update(); // בדיקת עדכון יזומה בכל טעינה
          // בחזרה לאפליקציה — לבדוק אם יצאה גרסה חדשה
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") reg.update();
          });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
